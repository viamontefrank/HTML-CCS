<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 100%;
            max-width: 1000px;
            
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th,td{
            border: 1px solid black;
            padding: 30px;
        }

        .cnome{
            background-color: aquamarine;
        }

        .cgrupo{
            background-color: lightgreen;
        }

        #cont{
            overflow-x: auto;
        }

        

    </style>
</head>
