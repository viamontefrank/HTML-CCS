<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        body h1{
            text-align: center;
        }
        table{
            margin: auto;
            width: 400px;
            height: 400px;
              /* border: 1px solid black; */
         border-collapse: collapse;
        
         box-shadow: 10px 10px 20px 2px rgba(0, 0, 0, 0.353);
        }
        td{
            border: 1px solid black;
            padding: 10px;
            text-align: left;  /*alinhamento horizontal*/
            vertical-align: middle; /*alinhamento vertical*/
        }

        td.numero{
            text-align: right;
            vertical-align:bottom;
        }

        
       

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>

<!-- 
    hierarquia de tabelas simples
    table 
      table row
        table header 
        table data  -->

    <table>
        <tr > <!--primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>

        <tr> 
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>

        <tr> 
            <td>A3</td>
            <td >B3</td>
            <td class="numero">C3</td>
        </tr>

        <tr> 
            <td>A4</td>
            <td>B4</td>
            <td class="numero">C4</td>
        </tr>
    </table>
</body>
</html>
