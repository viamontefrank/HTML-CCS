<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

<style>
    *{
        margin: 0;
        padding: 0px;   
    }

    body{
        padding: 30px;
        font-family: Arial, Helvetica, sans-serif;
    }

    table{
        width: 100%;
        max-width: 800px;
        border-collapse: collapse;

    }

    th,td{
        padding: 10px;
        border: 2px solid black;
    }

    .gris{
        background-color: gray;
        color: white;
    }

    .num{
        text-align: center;
        font-weight: bold;
    }

</style>

</head>


<body>

    <table>

        <thead>
            <tr class="gris">
                <th rowspan="2" scope="col">Area</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                
                <th rowspan="2" scope="col">Media</th>
            </tr>

            <tr class="gris">
                
                
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
                

            </tr>
        </thead>

        <tbody>

            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemáticas</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
            </tr>

            <tr>
            
                <td>Física</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
            </tr>

            <tr>
            
                <td>Química</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
            </tr>

            <tr>
            
                <td>Biologia</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
            </tr>

            <tr class="gris">
                
                <th colspan="4" scope="row">Media de Exatas</th>
                
                <td class="num">00.00</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>Historia</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>

            </tr>

            <tr>
                
                <td>Geografia</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                <td class="num">00.00</td>
                
            </tr>

            <tr class="gris">
                <th colspan="4" scope="row">Media de humanas</th>
                <td class="num">0.0</td>
            </tr>

      


           

           

        </tbody>

    </table>
    
</body>
</html>
