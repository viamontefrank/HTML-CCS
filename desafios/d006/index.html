<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Tags</title>
    <style>
        body{
            background-color: antiquewhite;
        }
    </style>
</head>
<body>
    <h1>uso dos Tags</h1>
    <p>no html existeb varios tags para ajudar na hora de desenvolver o site, passe o cursor por cima deles para ver o significado</p>

    <ul>
        <li><abbr title="use a tag &lt;p&gt;">paragrafos</abbr></li>
        <li><abbr title="use a tag &lt;h1&gt;">titulos</abbr></li>
        <li><abbr title="use a tag &lt;img&gt;">imagenes</abbr></li>
        <li><abbr title="use a tag &lt;abbr&gt;">abreviaciones</abbr></li>
        <li><abbr title="use a tag &lt;code&gt;">codigo-fonte</abbr></li>
        <li><abbr title="use a tag &lt;ol&gt;">listas numeradas</abbr></li>
        <li><abbr title="use a tag &lt;ul&gt;">listas con demarcad</abbr></li>

    </ul>

    
    
</body>
</html>
